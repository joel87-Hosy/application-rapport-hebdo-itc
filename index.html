<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITC - Reporting DG</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
      :root {
        --itc-blue: #004a99;
        --itc-orange: #f39200;
        --itc-ink: #1f2933;
        --itc-line: #d9e2ec;
      }

      body {
        min-height: 100vh;
        background-color: #f4f7f6;
        color: var(--itc-ink);
        font-family: "Segoe UI", sans-serif;
        font-size: 0.95rem;
      }

      .navbar {
        background: var(--itc-blue);
        color: white;
        border-bottom: 3px solid var(--itc-orange);
      }

      .navbar-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        margin-right: 10px;
        background: #ffffff;
        color: var(--itc-blue);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
        max-width: 1380px;
        margin: 0 auto;
      }

      .panel,
      .metric,
      .report-table-wrap {
        border: 1px solid var(--itc-line);
        border-radius: 8px;
        background: #ffffff;
      }

      .panel {
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 70px;
        max-height: calc(100vh - 88px);
        min-height: 0;
        overflow: hidden;
        padding: 18px;
      }

      .upload-zone {
        cursor: pointer;
        min-height: 180px;
        border: 2px dashed #b8c7d8;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .upload-zone:hover,
      .upload-zone.drag-over {
        border-color: var(--itc-blue);
        box-shadow: 0 0.5rem 1.4rem rgba(0, 74, 153, 0.12);
        transform: translateY(-1px);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      .metric {
        padding: 12px;
      }

      .metric span {
        color: #52606d;
        display: block;
        font-size: 0.78rem;
        line-height: 1.2;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 1.45rem;
      }

      .report-table-wrap {
        overflow-x: auto;
      }

      .report-table {
        min-width: 760px;
      }

      .report-table th {
        background: #edf4fb;
        color: #102a43;
        font-size: 0.78rem;
        vertical-align: middle;
      }

      .report-table td,
      .report-table th {
        white-space: nowrap;
      }

      .status-list {
        flex: 1;
        max-height: none;
        min-height: 0;
        overflow: auto;
      }

      .status-list-wrap {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      #reportOutput {
        max-height: max(320px, calc(100vh - 245px));
        overflow-y: auto;
        padding-right: 4px;
      }

      .status-item {
        border-bottom: 1px solid var(--itc-line);
      }

      .status-item summary {
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
      }

      .status-item summary::-webkit-details-marker {
        display: none;
      }

      .status-item summary span::before {
        content: "\f054";
        display: inline-block;
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.65rem;
        margin-right: 6px;
        transition: transform 120ms ease;
      }

      .status-item[open] summary span::before {
        transform: rotate(90deg);
      }

      .status-commune {
        padding: 8px 0 10px 14px;
      }

      .status-detail-table {
        font-size: 0.74rem;
        min-width: 620px;
      }

      .small-muted {
        color: #64748b;
        font-size: 0.82rem;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .panel {
          position: static;
          max-height: none;
        }

        .status-list {
          max-height: 260px;
        }

        #reportOutput {
          max-height: 70vh;
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark p-2 shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand d-flex align-items-center">
          <span class="navbar-logo" aria-label="Logo ITC">ITC</span>
          <span>ITC - Reporting DG</span>
        </span>
        <span id="fileLabel" class="badge bg-warning text-dark fs-6">
          En attente de fichier
        </span>
      </div>
    </nav>

    <main class="container-fluid p-3">
      <div class="workspace">
        <aside class="panel shadow-sm">
          <div
            id="dropZone"
            class="upload-zone d-flex flex-column align-items-center justify-content-center text-center p-4"
            onclick="document.getElementById('fileIn').click()"
          >
            <input
              type="file"
              id="fileIn"
              hidden
              accept=".xlsx,.xls"
              onchange="handleFile(event)"
            />
            <i class="fas fa-file-excel fa-3x text-success mb-3"></i>
            <h5>Televerser le canevas</h5>
            <p class="small-muted mb-0">
              Selectionnez ou deposez le fichier Excel du jour.
            </p>
          </div>

          <div class="mt-4">
            <label for="reportDate" class="form-label fw-semibold">
              Date du rapport
            </label>
            <input id="reportDate" type="date" class="form-control" />
          </div>

          <div class="d-grid gap-2 mt-3">
            <button
              id="generateBtn"
              class="btn btn-primary"
              type="button"
              disabled
              onclick="generateReport()"
            >
              <i class="fas fa-table me-2"></i>Generer les trois tableaux
            </button>
            <button
              id="exportBtn"
              class="btn btn-outline-success"
              type="button"
              disabled
              onclick="exportReport()"
            >
              <i class="fas fa-download me-2"></i>Exporter le rapport Excel
            </button>
          </div>

          <hr />

          <div class="status-list-wrap">
            <h6 class="fw-semibold mb-2">Statuts detectes</h6>
            <div id="statusList" class="status-list small-muted">
              Aucun canevas charge.
            </div>
          </div>
        </aside>

        <section>
          <div class="metric-grid mb-3">
            <div class="metric shadow-sm">
              <span>Lignes INSTANCE</span>
              <strong id="instanceCount">0</strong>
            </div>
            <div class="metric shadow-sm">
              <span>Lignes RACCORDE</span>
              <strong id="connectedCount">0</strong>
            </div>
            <div class="metric shadow-sm">
              <span>Raccordements du jour</span>
              <strong id="dailyConnectedCount">0</strong>
            </div>
            <div class="metric shadow-sm">
              <span>Total instances</span>
              <strong id="totalInstanceCount">0</strong>
            </div>
          </div>

          <div id="message" class="alert alert-info shadow-sm">
            Chargez le canevas pour produire le reporting DG.
          </div>

          <div id="reportOutput" class="d-grid gap-3"></div>
        </section>
      </div>
    </main>

    <script>
      const RULES = {
        instanceSheet: "INSTANCE",
        connectedSheet: "RACCORDE",
        columns: {
          instanceRab: ["N° abonnement", "Numero abonnement", "NumeroAbonnement"],
          instanceName: ["Nom du client", "NomClient"],
          instanceCommune: "Commune",
          instanceContact1: ["Contact 1", "Contact1"],
          instanceContact2: ["Contact 2", "Contact2"],
          instanceTeam: [
            "Equipe raccordement",
            "Équipe raccordement",
            "Equipe Raccordement",
          ],
          instanceDate: "Date enregistrement",
          instanceSendDate: [
            "Date d'envoi aux prestataires",
            "Date d'envoi prestataire",
            "Date envoi prestataire",
            "date d'envoi des instanaces aux prestataires",
          ],
          instanceProgress: "Avancement",
          instanceConnectionDate: [
            "Date prevue/reelle raccordement",
            "Date prevue / reelle raccordement",
            "Date prévue/réelle raccordement",
            "Date prévue / réelle raccordement",
          ],
          instanceDelay: "DELAI",
          instancePco: "PCO",
          instanceStudy: [
            "Etude technique",
            "Etude technique initial",
          ],
          instanceProblem: ["Probleme"],
          instanceComments: [
            "Commentaires",
            "Commentaires terrain",
            "Commentaires internes",
          ],
          connectedRegisterDate: "Date d'enregistrement d'instances",
          connectedSendDate: "date d'envoi des instanaces aux prestataires",
          connectedDate: "Date réelle de raccordement du client",
          connectedStatus:
            "Statut ( etude en cours , sans PCO , avec PCO, Pb clients, Pb Syndic)",
        },
        statuses: {
          pendingStudy: [
            "reprise etude en cours",
            "reprise etude non realise",
            "reprise etude non realisee",
          ],
          withoutPco: ["sans pco"],
          withPco: ["avec pco"],
          recruitmentWithPcoStudy: ["avec pco", "pco sature"],
          recruitmentWithPcoProblem: [
            "indisponibilite de pon",
            "probleme materiel",
            "ras",
            "deploiement pco",
          ],
          horsZoneStudy: ["hors zone"],
          outOfZone: [
            "hors zone couverture",
          ],
          excludedOutOfZoneProgress: ["reatribution", "reattribution", "raccorde"],
          waitingWithPcoProgress: [
            "raccordement en cour",
            "raccordement en cours",
            "en cour de raccordement",
            "en cours de raccordement",
          ],
          waitingWithPcoStudy: ["avec pco", "hors zone", "pco sature"],
          activeConnectionInProgress: [
            "en cours de raccordement",
            "en cour de raccordement",
            "raccordement en cours",
            "raccordement en cour",
          ],
          activeConnectionImplantation: ["implantation pm"],
          connected: ["raccorde"],
        },
      };

      const state = {
        workbookRows: null,
        reportRows: null,
        selectedFileName: "",
      };

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileIn");
      const fileLabel = document.getElementById("fileLabel");
      const message = document.getElementById("message");
      const reportDateInput = document.getElementById("reportDate");
      const generateBtn = document.getElementById("generateBtn");
      const exportBtn = document.getElementById("exportBtn");

      reportDateInput.value = new Date().toISOString().slice(0, 10);

      function normalize(value) {
        return String(value ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }

      function getValue(row, columnName) {
        if (!row) return "";
        const names = Array.isArray(columnName) ? columnName : [columnName];
        const wanted = names.map((name) => normalize(name));
        const keys = Object.keys(row);
        let key = keys.find((name) => wanted.includes(normalize(name)));
        if (!key) {
          key = keys.find((name) => {
            const cleanName = normalize(name);
            return wanted.some(
              (item) => cleanName.includes(item) || item.includes(cleanName)
            );
          });
        }
        return key ? row[key] : "";
      }

      function isValidDate(value) {
        return value instanceof Date && !Number.isNaN(value.getTime());
      }

      function excelDateToDate(value) {
        if (!value && value !== 0) return null;
        if (value instanceof Date) return isValidDate(value) ? value : null;
        if (typeof value === "number") {
          const utcValue = (value - 25569) * 86400;
          const date = new Date(utcValue * 1000);
          return isValidDate(date) ? date : null;
        }
        if (typeof value === "string") {
          const parsed = new Date(value);
          return isValidDate(parsed) ? parsed : null;
        }
        return null;
      }

      function sameDay(value, isoDate) {
        const date = excelDateToDate(value);
        if (!isValidDate(date)) return false;
        return date.toISOString().slice(0, 10) === isoDate;
      }

      function toIsoDate(date) {
        return date.toISOString().slice(0, 10);
      }

      function startOfIsoWeek(isoDate) {
        const date = new Date(`${isoDate}T00:00:00`);
        if (Number.isNaN(date.getTime())) return isoDate;
        const day = date.getDay() || 7;
        date.setDate(date.getDate() - day + 1);
        return toIsoDate(date);
      }

      function endOfIsoWeek(isoDate) {
        const date = new Date(`${startOfIsoWeek(isoDate)}T00:00:00`);
        if (Number.isNaN(date.getTime())) return isoDate;
        date.setDate(date.getDate() + 6);
        return toIsoDate(date);
      }

      function previousCompletedWeekRange(isoDate) {
        const currentWeekStart = new Date(`${startOfIsoWeek(isoDate)}T00:00:00`);
        if (Number.isNaN(currentWeekStart.getTime())) {
          return { start: isoDate, end: isoDate };
        }
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        const previousWeekEnd = new Date(currentWeekStart);
        previousWeekEnd.setDate(previousWeekEnd.getDate() + 6);
        return {
          start: toIsoDate(currentWeekStart),
          end: toIsoDate(previousWeekEnd),
        };
      }

      function startOfMonth(isoDate) {
        const date = new Date(`${isoDate}T00:00:00`);
        if (Number.isNaN(date.getTime())) return isoDate;
        return toIsoDate(new Date(date.getFullYear(), date.getMonth(), 1));
      }

      function endOfMonth(isoDate) {
        const date = new Date(`${isoDate}T00:00:00`);
        if (Number.isNaN(date.getTime())) return isoDate;
        return toIsoDate(new Date(date.getFullYear(), date.getMonth() + 1, 0));
      }

      function inIsoRange(value, startIsoDate, endIsoDate) {
        const date = excelDateToDate(value);
        if (!date) return false;
        const isoDate = toIsoDate(date);
        return isoDate >= startIsoDate && isoDate <= endIsoDate;
      }

      function addDaysIso(isoDate, days) {
        const date = new Date(`${isoDate}T00:00:00`);
        if (Number.isNaN(date.getTime())) return isoDate;
        date.setDate(date.getDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function daysBetween(startValue, endIsoDate) {
        const start = excelDateToDate(startValue);
        const end = new Date(`${endIsoDate}T00:00:00`);
        if (!start || Number.isNaN(end.getTime())) return null;
        return Math.max(0, Math.round((end - start) / 86400000));
      }

      function daysBetweenValues(startValue, endValue) {
        const start = excelDateToDate(startValue);
        const end = excelDateToDate(endValue);
        if (!start || !end) return null;
        return Math.max(0, Math.round((end - start) / 86400000));
      }

      function hoursBetweenValues(startValue, endValue) {
        const start = excelDateToDate(startValue);
        const end = excelDateToDate(endValue);
        if (!start || !end) return null;
        return Math.max(0, (end - start) / 3600000);
      }

      function average(values) {
        const valid = values.filter((value) => Number.isFinite(value));
        if (!valid.length) return 0;
        return Math.round(
          valid.reduce((sum, value) => sum + value, 0) / valid.length
        );
      }

      function averageRaw(values) {
        const valid = values.filter((value) => Number.isFinite(value));
        if (!valid.length) return 0;
        return valid.reduce((sum, value) => sum + value, 0) / valid.length;
      }

      function formatDuration(hours) {
        if (!Number.isFinite(hours) || hours <= 0) return "0 h";
        if (hours < 24) return `${Math.round(hours)} h`;

        const days = hours / 24;
        if (days < 7) return `${Math.round(days)} jour(s)`;

        const weeks = days / 7;
        if (weeks < 4) return `${Math.round(weeks)} semaine(s)`;

        const months = days / 30.4375;
        return `${Math.round(months)} mois`;
      }

      function averageDuration(values) {
        return formatDuration(averageRaw(values));
      }

      function averageDurationDays(values) {
        const hours = averageRaw(values);
        if (!Number.isFinite(hours) || hours <= 0) return "0 jour(s)";
        return `${Math.round(hours / 24)} jour(s)`;
      }

      function includesAny(value, expected) {
        const clean = normalize(value);
        return expected.some((item) => clean.includes(normalize(item)));
      }

      function equalsAny(value, expected) {
        const clean = normalize(value);
        return expected.some((item) => clean === normalize(item));
      }

      function isBlankOrRas(value) {
        const clean = normalize(value);
        return clean === "" || clean === "ras";
      }

      function containsIsoDate(value, isoDate) {
        if (!value || !isoDate) return false;
        const [year, month, day] = isoDate.split("-");
        const dayNumber = String(Number(day));
        const monthNumber = String(Number(month));
        const patterns = [
          isoDate,
          `${day}/${month}/${year}`,
          `${dayNumber}/${monthNumber}/${year}`,
          `${day}-${month}-${year}`,
          `${dayNumber}-${monthNumber}-${year}`,
        ];
        return patterns.some((pattern) => String(value).includes(pattern));
      }

      function getCombinedValue(row, columnNames) {
        const names = Array.isArray(columnNames) ? columnNames : [columnNames];
        return names.map((name) => getValue(row, name)).join(" ");
      }

      function classifyInstance(row) {
        const progress = getValue(row, RULES.columns.instanceProgress);
        const study = getValue(row, RULES.columns.instanceStudy);
        const pco = getValue(row, RULES.columns.instancePco);
        const merged = `${progress} ${study}`;

        if (equalsAny(progress, RULES.statuses.connected)) return "connected";
        if (includesAny(merged, RULES.statuses.outOfZone)) return "outOfZone";
        if (includesAny(study, RULES.statuses.withoutPco)) return "withoutPco";
        if (includesAny(study, RULES.statuses.withPco) || pco) return "withPco";
        if (includesAny(merged, RULES.statuses.pendingStudy)) return "pendingStudy";
        return "pendingStudy";
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("fr-FR").format(value || 0);
      }

      function sheetToRows(workbook, wantedName) {
        const sheetName = workbook.SheetNames.find((name) =>
          normalize(name).includes(normalize(wantedName))
        );
        if (!sheetName) return [];
        const sheet = workbook.Sheets[sheetName];
        const range = getActualSheetRange(sheet);
        return XLSX.utils.sheet_to_json(sheet, {
          defval: "",
          range,
          raw: true,
        });
      }

      function getActualSheetRange(sheet) {
        const cells = Object.keys(sheet).filter(
          (key) => key[0] !== "!" && sheet[key]?.v !== undefined && sheet[key]?.v !== ""
        );
        if (!cells.length) return sheet["!ref"];

        const declaredRange = XLSX.utils.decode_range(sheet["!ref"]);
        let maxUsefulColumn = declaredRange.s.c;
        cells.forEach((cellRef) => {
          const cell = XLSX.utils.decode_cell(cellRef);
          if (cell.r !== declaredRange.s.r) return;
          const header = normalize(sheet[cellRef]?.v);
          if (!header || /^colonne\d+$/.test(header)) return;
          maxUsefulColumn = Math.max(maxUsefulColumn, cell.c);
        });

        const range = cells.reduce(
          (acc, cellRef) => {
            const cell = XLSX.utils.decode_cell(cellRef);
            if (cell.c > maxUsefulColumn) return acc;
            return {
              s: {
                r: Math.min(acc.s.r, cell.r),
                c: Math.min(acc.s.c, cell.c),
              },
              e: {
                r: Math.max(acc.e.r, cell.r),
                c: Math.max(acc.e.c, cell.c),
              },
            };
          },
          {
            s: { r: Number.MAX_SAFE_INTEGER, c: Number.MAX_SAFE_INTEGER },
            e: { r: 0, c: 0 },
          }
        );

        sheet["!ref"] = XLSX.utils.encode_range(range);
        return range;
      }

      function setMessage(type, text) {
        message.className = `alert alert-${type} shadow-sm`;
        message.textContent = text;
      }

      function setSelectedFile(file) {
        if (!file) return;
        state.selectedFileName = file.name;
        fileLabel.innerText = file.name;
        setMessage("info", "Lecture du canevas en cours...");

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const workbook = XLSX.read(event.target.result, {
              type: "array",
              cellDates: true,
              cellFormula: false,
              cellHTML: false,
              cellNF: false,
              cellStyles: false,
            });
            const instances = sheetToRows(workbook, RULES.instanceSheet);
            const connected = sheetToRows(workbook, RULES.connectedSheet);
            state.workbookRows = { instances, connected };
            state.reportRows = null;
            generateBtn.disabled = !instances.length && !connected.length;
            exportBtn.disabled = true;
            document.getElementById("reportOutput").innerHTML = "";
            updateStatusPreview();
            setMessage(
              "success",
              `Canevas charge: ${instances.length} instances et ${connected.length} raccordements detectes.`
            );
          } catch (error) {
            console.error(error);
            state.workbookRows = null;
            generateBtn.disabled = true;
            exportBtn.disabled = true;
            setMessage("danger", "Impossible de lire le fichier Excel.");
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function handleFile(event) {
        setSelectedFile(event.target.files?.[0]);
      }

      function updateStatusPreview() {
        const { instances = [], connected = [] } = state.workbookRows || {};
        const statusGroups = {};

        instances.forEach((row) => {
          const status = getValue(row, RULES.columns.instanceProgress) || "(vide)";
          if (!statusGroups[status]) statusGroups[status] = [];
          statusGroups[status].push(row);
        });

        const html = Object.entries(statusGroups)
          .sort((a, b) => b[1].length - a[1].length)
          .map(([status, rows]) => renderStatusDetails(status, rows))
          .join("");

        document.getElementById("statusList").innerHTML =
          html || "Aucun statut detecte.";
        document.getElementById("instanceCount").textContent = formatNumber(
          instances.length
        );
        document.getElementById("connectedCount").textContent = formatNumber(
          connected.length
        );
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDateValue(value) {
        const date = excelDateToDate(value);
        if (!date) return escapeHtml(value);
        return date.toLocaleDateString("fr-FR");
      }

      function formatIsoDateLabel(isoDate) {
        return formatDateValue(`${isoDate}T00:00:00`);
      }

      function renderStatusDetails(status, rows) {
        const communes = {};
        rows.forEach((row) => {
          const commune =
            getValue(row, RULES.columns.instanceCommune) || "Commune non renseignee";
          if (!communes[commune]) communes[commune] = [];
          communes[commune].push(row);
        });

        const communeHtml = Object.entries(communes)
          .sort((a, b) => a[0].localeCompare(b[0], "fr"))
          .map(([commune, communeRows]) => {
            const details = communeRows
              .map(
                (row) => `
                  <tr>
                    <td>${escapeHtml(getValue(row, RULES.columns.instanceRab))}</td>
                    <td>${escapeHtml(getValue(row, RULES.columns.instanceName))}</td>
                    <td>${escapeHtml(getValue(row, RULES.columns.instanceContact1))}</td>
                    <td>${escapeHtml(getValue(row, RULES.columns.instanceContact2))}</td>
                    <td>${formatDateValue(getValue(row, RULES.columns.instanceSendDate))}</td>
                  </tr>
                `
              )
              .join("");

            return `
              <details class="status-commune">
                <summary>
                  <span>${escapeHtml(commune)}</span>
                  <strong>${formatNumber(communeRows.length)}</strong>
                </summary>
                <div class="table-responsive mt-2">
                  <table class="table table-sm table-bordered status-detail-table mb-0">
                    <thead>
                      <tr>
                        <th>Numero RAB</th>
                        <th>Nom du client</th>
                        <th>Contact 1</th>
                        <th>Contact 2</th>
                        <th>Date d'envoi</th>
                      </tr>
                    </thead>
                    <tbody>${details}</tbody>
                  </table>
                </div>
              </details>
            `;
          })
          .join("");

        return `
          <details class="status-item">
            <summary>
              <span>${escapeHtml(status)}</span>
              <strong>${formatNumber(rows.length)}</strong>
            </summary>
            ${communeHtml}
          </details>
        `;
      }

      function buildTeamRanking(rows, periodLabel, startIsoDate, endIsoDate) {
        const teamCounts = {};
        rows.forEach((row) => {
          if (
            !equalsAny(
              getValue(row, RULES.columns.instanceProgress),
              RULES.statuses.connected
            ) ||
            !inIsoRange(
              getValue(row, RULES.columns.instanceConnectionDate),
              startIsoDate,
              endIsoDate
            )
          ) {
            return;
          }

          const team =
            getValue(row, RULES.columns.instanceTeam) || "Equipe non renseignee";
          teamCounts[team] = (teamCounts[team] || 0) + 1;
        });

        return Object.entries(teamCounts)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr"))
          .map(([team, count], index) => ({
            Periode: periodLabel,
            Rang: index + 1,
            Equipe: team,
            "Instances realisees": count,
          }));
      }

      function buildReport() {
        const isoDate = reportDateInput.value;
        const { instances = [], connected = [] } = state.workbookRows || {};
        const instanceGroups = {
          pendingStudy: [],
          withoutPco: [],
          withPco: [],
          outOfZone: [],
        };
        const connectedInstanceTodayGroups = { withoutPco: [], withPco: [] };

        instances.forEach((row) => {
          const progress = getValue(row, RULES.columns.instanceProgress);
          const study = getValue(row, RULES.columns.instanceStudy);
          const problem = getValue(row, RULES.columns.instanceProblem);
          const isActiveConnection =
            equalsAny(progress, RULES.statuses.activeConnectionInProgress) ||
            equalsAny(progress, RULES.statuses.activeConnectionImplantation);

          if (equalsAny(progress, ["reprise etude en cours"])) {
            instanceGroups.pendingStudy.push(row);
          }
          if (
            isActiveConnection &&
            includesAny(study, RULES.statuses.withoutPco)
          ) {
            instanceGroups.withoutPco.push(row);
          }
          if (
            isActiveConnection &&
            includesAny(study, RULES.statuses.withPco)
          ) {
            instanceGroups.withPco.push(row);
          }
          if (
            includesAny(problem, RULES.statuses.outOfZone) &&
            equalsAny(study, RULES.statuses.horsZoneStudy) &&
            !equalsAny(progress, RULES.statuses.excludedOutOfZoneProgress)
          ) {
            instanceGroups.outOfZone.push(row);
          }
          if (
            equalsAny(progress, RULES.statuses.connected) &&
            sameDay(getValue(row, RULES.columns.instanceConnectionDate), isoDate)
          ) {
            if (includesAny(study, RULES.statuses.withoutPco)) {
              connectedInstanceTodayGroups.withoutPco.push(row);
            }
            if (!includesAny(study, RULES.statuses.withoutPco)) {
              connectedInstanceTodayGroups.withPco.push(row);
            }
          }
        });

        const connectedInstanceToday = instances.filter(
          (row) =>
            equalsAny(
              getValue(row, RULES.columns.instanceProgress),
              RULES.statuses.connected
            ) &&
            sameDay(getValue(row, RULES.columns.instanceConnectionDate), isoDate)
        );

        const instanceConnectionDelay = (rows) =>
          rows.map((row) =>
            hoursBetweenValues(
              getValue(row, RULES.columns.instanceDate),
              getValue(row, RULES.columns.instanceConnectionDate)
            )
          );
        const instanceWaitingDelay = (rows) =>
          rows.map((row) => {
            const days = daysBetween(
              getValue(row, RULES.columns.instanceSendDate),
              isoDate
            );
            return days === null ? null : days * 24;
          });
        const instanceCanvasConnectionDelay = (rows) =>
          rows.map((row) =>
            hoursBetweenValues(
              getValue(row, RULES.columns.instanceSendDate),
              getValue(row, RULES.columns.instanceConnectionDate)
            )
          );
        const recruitmentWithPco = instances.filter(
          (row) =>
            !equalsAny(
              getValue(row, RULES.columns.instanceProgress),
              RULES.statuses.connected
            ) &&
            equalsAny(
              getValue(row, RULES.columns.instanceProblem),
              RULES.statuses.recruitmentWithPcoProblem
            ) &&
            includesAny(
              getValue(row, RULES.columns.instanceStudy),
              RULES.statuses.recruitmentWithPcoStudy
            )
        );
        const recruitment = [
          {
            Date: isoDate,
            "Commandes du Jour": instances.filter((row) =>
              sameDay(
                getValue(row, RULES.columns.instanceSendDate),
                isoDate
              )
            ).length,
            "Raccordement du Jour": instances.filter((row) =>
              equalsAny(
                getValue(row, RULES.columns.instanceProgress),
                RULES.statuses.connected
              ) &&
              sameDay(
                getValue(row, RULES.columns.instanceConnectionDate),
                isoDate
              )
            ).length,
            "Cumul Instances en Etude": instanceGroups.pendingStudy.length,
            "Cumul Instances Sans PCO": instanceGroups.withoutPco.length,
            "Cumul Instances Avec PCO": recruitmentWithPco.length,
            "Cumul Instances Hors Zone": instanceGroups.outOfZone.length,
            Total:
              instanceGroups.pendingStudy.length +
              instanceGroups.withoutPco.length +
              recruitmentWithPco.length +
              instanceGroups.outOfZone.length,
          },
        ];
        const waitingWithPco = instances.filter(
          (row) =>
            equalsAny(
              getValue(row, RULES.columns.instanceProgress),
              RULES.statuses.waitingWithPcoProgress
            ) &&
            includesAny(
              getValue(row, RULES.columns.instanceStudy),
              RULES.statuses.waitingWithPcoStudy
            )
        );

        const waiting = [
          {
            Date: isoDate,
            "Instances Sans PCO - Cumul": instanceGroups.withoutPco.length,
            "Instances Sans PCO - Delai Moyen":
              averageDurationDays(instanceWaitingDelay(instanceGroups.withoutPco)),
            "Instances Avec PCO - Cumul": waitingWithPco.length,
            "Instances Avec PCO - Delai Moyen":
              averageDurationDays(instanceWaitingDelay(waitingWithPco)),
          },
        ];

        const sansPcoDelay = instanceConnectionDelay(
          connectedInstanceTodayGroups.withoutPco
        );
        const avecPcoDelay = instanceConnectionDelay(
          connectedInstanceTodayGroups.withPco
        );
        const production = [
          {
            Date: isoDate,
            "Raccordement du Jour": connectedInstanceToday.length,
            "Clients raccordes Sans PCO":
              connectedInstanceTodayGroups.withoutPco.length,
            "Sans PCO - Delai Moyen": averageDuration(sansPcoDelay),
            "Clients raccordes Avec PCO":
              connectedInstanceTodayGroups.withPco.length,
            "Avec PCO - Delai Moyen": averageDurationDays(avecPcoDelay),
            "Delai Moyen de raccordement": averageDuration(
              instanceCanvasConnectionDelay(connectedInstanceToday)
            ),
          },
        ];
        const completedWeek = previousCompletedWeekRange(isoDate);
        const weekStart = completedWeek.start;
        const weekEnd = completedWeek.end;
        const monthStart = startOfMonth(isoDate);
        const monthEnd = endOfMonth(isoDate);
        const teamRankingWeek = buildTeamRanking(
          instances,
          `Semaine du ${formatIsoDateLabel(weekStart)} au ${formatIsoDateLabel(weekEnd)}`,
          weekStart,
          weekEnd
        );
        const teamRankingMonth = buildTeamRanking(
          instances,
          `Mois du ${formatIsoDateLabel(monthStart)} au ${formatIsoDateLabel(monthEnd)}`,
          monthStart,
          monthEnd
        );

        return {
          recruitment,
          waiting,
          production,
          teamRankingWeek,
          teamRankingMonth,
        };
      }

      function renderTable(title, rows) {
        const columns = Object.keys(rows[0] || {});
        if (!columns.length) {
          return `
            <div>
              <h5 class="mb-2">${title}</h5>
              <div class="report-table-wrap shadow-sm p-3 small-muted">
                Aucune donnee pour cette periode.
              </div>
            </div>
          `;
        }
        const head = columns.map((column) => `<th>${column}</th>`).join("");
        const body = rows
          .map(
            (row) =>
              `<tr>${columns
                .map((column) => `<td>${formatCell(row[column])}</td>`)
                .join("")}</tr>`
          )
          .join("");
        return `
          <div>
            <h5 class="mb-2">${title}</h5>
            <div class="report-table-wrap shadow-sm">
              <table class="table table-sm table-bordered report-table mb-0">
                <thead><tr>${head}</tr></thead>
                <tbody>${body}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function formatCell(value) {
        if (typeof value === "number") return formatNumber(value);
        return value ?? "";
      }

      function generateReport() {
        if (!state.workbookRows) return;
        state.reportRows = buildReport();
        const {
          recruitment,
          waiting,
          production,
          teamRankingWeek,
          teamRankingMonth,
        } = state.reportRows;

        document.getElementById("dailyConnectedCount").textContent = formatNumber(
          recruitment[0]["Raccordement du Jour"]
        );
        document.getElementById("totalInstanceCount").textContent = formatNumber(
          recruitment[0].Total
        );
        document.getElementById("reportOutput").innerHTML = [
          renderTable("Recrutement - Etudes", recruitment),
          renderTable("Clients en attente de raccordement", waiting),
          renderTable("Production Journaliere", production),
          renderTable("Classement des equipes - Semaine", teamRankingWeek),
          renderTable("Classement des equipes - Mois", teamRankingMonth),
        ].join("");
        exportBtn.disabled = false;
        setMessage(
          "success",
          "Tableaux generes avec les regles configurees."
        );
      }

      function exportReport() {
        if (!state.reportRows) return;
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.json_to_sheet(state.reportRows.recruitment),
          "Recrutement - Etudes"
        );
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.json_to_sheet(state.reportRows.waiting),
          "Clients en attente"
        );
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.json_to_sheet(state.reportRows.production),
          "Production Journaliere"
        );
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.json_to_sheet(state.reportRows.teamRankingWeek),
          "Equipes semaine"
        );
        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.json_to_sheet(state.reportRows.teamRankingMonth),
          "Equipes mois"
        );

        const datePart = reportDateInput.value.replaceAll("-", "");
        XLSX.writeFile(workbook, `Reporting-DG-${datePart}.xlsx`);
      }

      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add("drag-over");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove("drag-over");
        });
      });

      dropZone.addEventListener("drop", (event) => {
        const file = event.dataTransfer.files?.[0];
        if (!file) return;

        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;
        setSelectedFile(file);
      });
    </script>
  </body>
